  <style>
    /* ════════════════════════════════════════
       1. RESET & VARIABLES
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #EEF2F7;
      --card:     #FFFFFF;
      --text:     #1E293B;
      --muted:    #64748B;
      --border:   #CBD5E1;
      --line:     #E2E8F0;
      --brand:    #1D4ED8;
      --brand-dk: #1E40AF;
      --brand-lt: #EFF6FF;
      --safe-a: #15803D;  --safe-b: #14532D;
      --warn-a: #B45309;  --warn-b: #78350F;
      --dngr-a: #B91C1C;  --dngr-b: #7F1D1D;
      --green:  #16A34A;
      --red:    #DC2626;
      --purple: #7C3AED;
      --amber:  #D97706;
      --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
      --r-xl: 24px; --r-pill: 999px;
      --shadow:    0 2px 10px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.04);
      --shadow-lg: 0 8px 28px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
      --font-dash: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --app-max: min(94vw, 720px);
      --sheet-max: min(94vw, 560px);
    }
    html, body { height: 100%; overflow-x: hidden; width: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain;
    }

    /* ════════════════════════════════════════
       2. UTILITY
    ════════════════════════════════════════ */
    .hidden { display: none !important; }
    .app {
      max-width: var(--app-max); margin: 0 auto; min-height: 100vh; min-height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
    }
    /* Desktop/tablet: beri sedikit ruang samping supaya kartu tidak menempel tepi viewport */
    @media (min-width: 640px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .stock-card, .form-card, .history-card, .bottom-actions { margin-left: 4px; margin-right: 4px; }
    }

    /* ════════════════════════════════════════
       3. SHARED
    ════════════════════════════════════════ */
    .t-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-md);
      padding: 11px 14px; font-size: 15px; font-weight: 500;
      outline: none; color: var(--text); background: #fff;
      transition: border-color .15s, box-shadow .15s; -webkit-appearance: none;
    }
    .t-input::placeholder { color: #A0AEC0; font-weight: 400; }
    .t-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
    .btn {
      appearance: none; border: none; border-radius: var(--r-md);
      font-weight: 700; font-size: 15px; padding: 13px 18px; cursor: pointer;
      touch-action: manipulation;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform .1s, opacity .15s, background .2s;
    }
    .btn:active   { transform: scale(.96); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
    .btn-block   { width: 100%; }
    .btn-primary { background: var(--brand);  color: #fff; }
    .btn-ghost   { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-purple  { background: var(--purple); color: #fff; }
    .btn-danger  { background: var(--red);    color: #fff; }

    /* ════════════════════════════════════════
       4. LOGIN
    ════════════════════════════════════════ */
    .login-view {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; padding: 24px 16px;
    }
    .login-card {
      width: 100%; max-width: min(92vw, 400px); background: var(--card);
      border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
      padding: 28px 20px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .login-brand  { text-align: center; margin-bottom: 2px; }
    .login-logo   { display: block; margin: 0 auto 12px; border-radius: 20px; box-shadow: 0 8px 22px rgba(29,78,216,.28); }
    .login-title  { font-size: 26px; font-weight: 900; letter-spacing: -.4px; }
    .login-sub    { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .field-label  {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .login-code {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-md);
      padding: 14px 16px; font-size: 22px; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
      outline: none; color: var(--text); text-align: center; background: #fff;
      transition: border-color .15s, box-shadow .15s; -webkit-appearance: none;
    }
    .login-code::placeholder { color: #CBD5E1; letter-spacing:.04em; font-weight:400; font-size:15px; text-transform:none; }
    .login-code:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
    .login-error { font-size: 13px; font-weight: 600; color: var(--red); text-align: center; min-height: 18px; }
    .login-hint  { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.55; }
    .login-demo-hint {
      font-size: 13px; font-weight: 600; color: var(--brand-dk);
      background: var(--brand-lt); border-radius: var(--r-md);
      padding: 10px 14px; text-align: center; line-height: 1.5;
    }
    .login-demo-hint strong { font-weight: 900; letter-spacing: .08em; }

    /* ════════════════════════════════════════
       5. STOCK CARD
    ════════════════════════════════════════ */
    .stock-card {
      margin: 12px 10px 10px; border-radius: var(--r-xl);
      padding: 18px 18px 16px; color: #fff; box-shadow: var(--shadow-lg);
      transition: background .35s ease; position: relative; overflow: hidden;
    }
    .stock-card::before {
      content: ''; position: absolute; right: -24px; top: -24px;
      width: 160px; height: 160px; border-radius: 50%;
      background: rgba(255,255,255,.06); pointer-events: none;
    }
    .stock-card.safe    { background: linear-gradient(145deg, var(--safe-a), var(--safe-b)); }
    .stock-card.warning { background: linear-gradient(145deg, var(--warn-a), var(--warn-b)); }
    .stock-card.danger  { background: linear-gradient(145deg, var(--dngr-a), var(--dngr-b)); }

    /* Baris 1: brand (ikon + judul + subjudul) & tombol menu, nama/role user di kanan bawahnya */
    .sc-topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; position: relative; z-index: 1; }
    .sc-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sc-brand-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .sc-brand-text { min-width: 0; }
    .sc-brand-title {
      font-size: 16px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sc-brand-sub {
      font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      opacity: .62; margin-top: 1px;
    }
    #scClock {
      letter-spacing: normal; text-transform: none;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .sc-topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .sc-menu-btn {
      appearance: none; border: none;
      background: rgba(255,255,255,.16); border-radius: 50%;
      min-width: 36px; min-height: 36px; aspect-ratio: 1;
      color: #fff; cursor: pointer; touch-action: manipulation; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .sc-menu-btn:active { transform: scale(.88); background: rgba(255,255,255,.32); }
    .sc-userblock { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .sc-nama { font-size: 14px; font-weight: 800; opacity: .96; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .sc-role { font-size: 10px; font-weight: 700; opacity: .68; letter-spacing: .1em; text-transform: uppercase; }

    /* Baris 2: status "online" — teks dekoratif statis, tidak mencerminkan koneksi nyata */
    .sc-online-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22C55E; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(34,197,94,.25);
    }
    .sc-online-label { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #86EFAC; }

    /* Baris 3: angka besar — fokus utama */
    .sc-numwrap { text-align: center; padding: 8px 0 4px; position: relative; z-index: 1; }
    .stock-number {
      font-family: var(--font-dash);
      font-size: clamp(58px, 19vw, 104px); font-weight: 700; line-height: 1;
      letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
    }
    .sc-unit {
      font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      opacity: .72; margin-top: 4px;
    }
    @keyframes stockPop { 0%{transform:scale(1)} 35%{transform:scale(1.07)} 100%{transform:scale(1)} }
    .stock-number.pop { animation: stockPop .28s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Baris 4: status pill (ikon shield seragam, teks & warna mengikuti status) */
    .sc-status-row { display: flex; justify-content: center; margin-bottom: 16px; position: relative; z-index: 1; }
    .sc-status-pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
      background: rgba(255,255,255,.16); border-radius: var(--r-pill); padding: 8px 18px;
    }
    .sc-status-pill svg { flex-shrink: 0; }

    /* Baris 5: statistik masuk / keluar bulan ini — ikon lingkaran ring, jelas & terpisah */
    .sc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
    .stat-chip {
      background: rgba(255,255,255,.13); border-radius: var(--r-lg);
      padding: 12px; display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .stat-icon {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: #fff; border: 3px solid; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
    }
    .stat-chip.masuk  .stat-icon { border-color: var(--green); color: var(--green); }
    .stat-chip.keluar .stat-icon { border-color: var(--red);   color: var(--red); }
    .stat-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    .stat-label {
      font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .78;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stat-value { font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; }

    /* ════════════════════════════════════════
       6. FORM CARD
    ════════════════════════════════════════ */
    .form-card {
      margin: 0 10px 10px; background: var(--card);
      border-radius: var(--r-xl); padding: 12px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px;
    }
    .demo-notice {
      display: flex; align-items: center; gap: 6px;
      background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.25);
      border-radius: var(--r-md); padding: 8px 12px;
      font-size: 12px; font-weight: 700; color: #92400E;
    }
    .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: var(--bg); border-radius: var(--r-md); padding: 4px; }
    .mode-btn {
      appearance: none; border: none; border-radius: calc(var(--r-md) - 2px);
      padding: 11px 8px; font-size: 15px; font-weight: 800; letter-spacing: -.1px;
      color: var(--muted); background: transparent; cursor: pointer; touch-action: manipulation;
      transition: background .18s, color .18s, box-shadow .18s;
    }
    .mode-btn.active           { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
    .mode-btn.active.ambil     { color: var(--brand); }
    .mode-btn.active.datang    { color: var(--green); }
    .qty-row { display: flex; align-items: center; gap: 8px; }
    .qty-side {
      appearance: none; border: none; border-radius: var(--r-md);
      min-width: 52px; min-height: 52px; aspect-ratio: 1;
      font-size: 26px; font-weight: 900; line-height: 1;
      cursor: pointer; background: var(--bg); color: var(--text); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; transition: background .1s, transform .1s;
    }
    .qty-side:active { transform: scale(.88); background: var(--border); }
    .qty-field {
      flex: 1; min-height: 52px; padding: 6px 4px; border: 1.5px solid var(--border); border-radius: var(--r-md);
      text-align: center; font-size: clamp(22px, 6vw, 30px); font-weight: 900; font-variant-numeric: tabular-nums;
      outline: none; color: var(--text); background: #fff; -webkit-appearance: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .qty-field::-webkit-inner-spin-button, .qty-field::-webkit-outer-spin-button { -webkit-appearance: none; }
    .qty-field[type=number] { -moz-appearance: textfield; }
    .qty-field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
    .note-field {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-md);
      padding: 11px 14px; font-size: 14px; outline: none;
      color: var(--text); background: #fff; -webkit-appearance: none;
      transition: border-color .15s;
    }
    .note-field::placeholder { color: #A0AEC0; font-size: 13px; }
    .note-field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
    .photo-box { position: relative; }
    .photo-thumb {
      min-height: 110px; max-height: 280px; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--brand);
      text-align: center; line-height: 1.5; padding: 18px; transition: background .2s;
      border: 1.5px dashed var(--border); border-radius: var(--r-md); overflow: hidden;
    }
    .photo-thumb.has-photo { background: #0F172A; padding: 8px; }
    .photo-thumb img {
      display: block; width: auto; height: auto;
      max-width: 100%; max-height: 264px; object-fit: contain;
      border-radius: calc(var(--r-md) - 5px);
    }
    .photo-remove {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      appearance: none; border: none; border-radius: 50%;
      width: 30px; height: 30px; background: rgba(15,23,42,.72); color: #fff;
      font-size: 15px; font-weight: 800; cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .photo-remove:active { transform: scale(.88); background: rgba(15,23,42,.9); }
    #photoInputCamera, #photoInputGallery { display: none; }
    .photo-source-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .photo-source-btn {
      appearance: none; border: 1.5px solid var(--border); border-radius: var(--r-md);
      background: #fff; color: var(--text); font-size: 13px; font-weight: 700;
      padding: 11px 8px; cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .1s;
    }
    .photo-source-btn:active { transform: scale(.97); background: var(--bg); }
    .submit-btn {
      width: 100%; padding: 15px 16px;
      font-size: 16px; font-weight: 800; letter-spacing: -.1px;
      border: none; border-radius: var(--r-md); cursor: pointer;
      font-variant-numeric: tabular-nums; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s, transform .1s, opacity .15s;
    }
    .submit-btn:active:not(:disabled) { transform: scale(.98); }
    .submit-btn:disabled { cursor: not-allowed; transform: none !important; }
    .submit-btn[data-state="idle"][data-mode="AMBIL"]  { background: var(--brand); color: #fff; }
    .submit-btn[data-state="idle"][data-mode="DATANG"] { background: var(--green); color: #fff; }
    .submit-btn[data-state="idle"]:disabled            { background: var(--amber); color: #fff; opacity: 1; }
    .submit-btn[data-state="confirm"]                  { background: var(--amber); color: #fff; }
    .submit-btn[data-state="submitting"]               { background: var(--muted); color: #fff; opacity:.7; }

    /* ════════════════════════════════════════
       7. AKSI BAWAH (Laporan Bulanan · Riwayat Lengkap)
    ════════════════════════════════════════ */
    .bottom-actions { margin: 10px 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .bottom-btn {
      appearance: none; border: none; cursor: pointer; touch-action: manipulation;
      background: var(--card); border-radius: var(--r-xl); padding: 15px 8px; box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13px; font-weight: 800; color: var(--text); white-space: nowrap;
      transition: transform .1s, background .15s;
    }
    .bottom-btn:active { transform: scale(.97); background: var(--bg); }
    .bb-icon { font-size: 16px; line-height: 1; }

    /* ════════════════════════════════════════
       8. HISTORY CARD
    ════════════════════════════════════════ */
    .history-card {
      margin: 0 10px; background: var(--card);
      border-radius: var(--r-xl); padding: 12px 12px 14px; box-shadow: var(--shadow);
    }
    .history-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; gap: 8px; }
    .tx-count-badge { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
    .history-hint { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
    .tx-list { display: flex; flex-direction: column; gap: 5px; }
    .tx-date-hdr { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 2px 5px; letter-spacing: .02em; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
    .tx-list > .tx-date-hdr:first-child { padding-top: 0; }
    .tx-item {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 12px; border-radius: var(--r-md); background: var(--bg);
      cursor: default; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      transition: background .15s, transform .15s;
    }
    .tx-item.tx-day-a { background: #F8FAFC; }
    .tx-item.tx-day-b { background: #E9EFF7; }
    .tx-item.tx-day-c { background: #F3F0FA; }
    .tx-item.tx-day-d { background: #FBF3E7; }
    .tx-item.pressing { background: var(--border) !important; transform: scale(.98); }
    .tx-more-btn {
      appearance: none; border: 1.5px dashed var(--border); border-radius: var(--r-md);
      background: transparent; color: var(--brand); width: 100%;
      padding: 11px; margin-top: 8px; font-size: 13px; font-weight: 800;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .1s;
    }
    .tx-more-btn:active { transform: scale(.98); background: var(--brand-lt); }
    .tx-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tx-nama { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .tx-qty  { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .tx-qty.minus   { color: var(--red); }
    .tx-qty.plus    { color: var(--green); }
    .tx-qty.neutral { color: var(--purple); }
    .tx-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tx-row3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 1px; }
    .tx-meta-row { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; overflow: hidden; }
    .tx-pill { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-pill); font-size: 9px; font-weight: 800; letter-spacing: .06em; padding: 3px 7px; white-space: nowrap; flex-shrink: 0; }
    .tx-pill.ambil   { background: #DBEAFE; color: #1D4ED8; }
    .tx-pill.datang  { background: #DCFCE7; color: #15803D; }
    .tx-pill.koreksi { background: #F3E8FF; color: var(--purple); }
    .tx-time  { font-size: 11px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
    .tx-note  { font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tx-right2 { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tx-sisa { font-size: 11px; color: var(--muted); font-weight: 600; }
    .tx-photo-link { font-size: 13px; color: var(--brand); text-decoration: none; }
    .tx-empty { text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; padding: 18px 0; }

    /* ════════════════════════════════════════
       9. ADMIN MODAL
    ════════════════════════════════════════ */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.52);
      z-index: 90; display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn  { from { opacity: 0; }                to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes popIn   { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    .modal-sheet {
      width: 100%; max-width: var(--sheet-max); background: var(--card);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
      max-height: 88vh; max-height: 88dvh; overflow-y: auto;
      animation: slideUp .22s ease;
      display: flex; flex-direction: column; gap: 14px;
    }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: var(--r-pill); margin: 0 auto -2px; }

    /* Menu overflow (⋮): Refresh / Admin / Logout — bottom-sheet, pola sama dgn modal lain */
    .menu-list { display: flex; flex-direction: column; gap: 4px; }
    .menu-item {
      appearance: none; border: none; background: var(--bg);
      border-radius: var(--r-md); padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 15px; font-weight: 700; color: var(--text);
      cursor: pointer; touch-action: manipulation; text-align: left;
      transition: background .15s, transform .1s;
    }
    .menu-item:active { transform: scale(.98); background: var(--border); }
    .menu-item .mi-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 22px; }
    .menu-item.mi-danger { color: var(--red); }
    .menu-item.spinning .mi-icon svg { animation: spin .65s linear infinite; }
    .menu-item:disabled { opacity: .55; cursor: not-allowed; }

    /* Varian terpusat: dialog konfirmasi cepat (Ya/Batal) — bukan bottom-sheet */
    .modal-backdrop.center { align-items: center; padding: 20px; }
    .modal-sheet.center {
      border-radius: var(--r-xl);
      width: 100%; max-width: min(90vw, 360px);
      padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
      max-height: 80vh; max-height: 80dvh;
      animation: popIn .2s ease;
    }
    .sheet-title  { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
    .admin-block  { background: var(--bg); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .admin-block-title { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .admin-block-desc  { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: -4px; }
    .admin-row   { display: flex; gap: 8px; }
    .admin-field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .admin-field > label { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
    .admin-current { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0; }

    /* ════════════════════════════════════════
       10. DELETE MODAL
    ════════════════════════════════════════ */
    .delete-card { background: var(--bg); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .delete-nama { font-size: 18px; font-weight: 900; color: var(--text); }
    .delete-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .delete-stock { font-size: 14px; font-weight: 700; background: var(--brand-lt); color: var(--brand-dk); border-radius: var(--r-md); padding: 10px 14px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ════════════════════════════════════════
       11. MONTHLY TABLE MODAL
    ════════════════════════════════════════ */
    .monthly-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.6);
      z-index: 95; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      animation: fadeIn .2s ease;
    }
    .monthly-sheet {
      width: 100%; max-width: min(96vw, 920px);
      height: 96vh; height: 96dvh; max-height: 96vh; max-height: 96dvh;
      background: var(--card);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
      animation: slideUp .22s ease;
    }

    /* — Fixed header — */
    .mt-picker-screen, .mt-report-screen {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
    }
    .mt-header {
      display: flex; align-items: center; gap: 6px;
      padding: 14px 12px 12px; border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .mt-nav {
      appearance: none; border: none;
      background: var(--bg); border-radius: 50%;
      min-width: 36px; min-height: 36px; aspect-ratio: 1;
      font-size: 18px; font-weight: 700; line-height: 1;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, transform .1s;
    }
    .mt-nav:active   { transform: scale(.88); background: var(--border); }
    .mt-nav:disabled { opacity: .3; }
    .mt-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mt-close {
      appearance: none; border: none;
      background: var(--bg); border-radius: 50%;
      min-width: 36px; min-height: 36px; aspect-ratio: 1;
      font-size: 16px; line-height: 1;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, transform .1s; color: var(--muted);
    }
    .mt-close:active { transform: scale(.88); }

    /* — Tombol export — */
    .mt-export-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .mt-export-btns .mt-nav { font-size: 16px; }

    /* — Info bar — */
    .mt-info {
      padding: 7px 14px; font-size: 11px; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--line); flex-shrink: 0;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .mt-info span { white-space: nowrap; }
    .mt-info .hi { color: var(--green); font-weight: 800; }
    .mt-info .lo { color: var(--red);   font-weight: 800; }
    .mt-info .bl { color: var(--brand); font-weight: 800; }

    /* — Loading — */
    .mt-loading {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--muted); font-weight: 600; gap: 8px;
    }

    /* — Scrollable table wrap — */
    .mt-wrap {
      flex: 1; min-height: 0; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* — Judul khusus saat print (tersembunyi di layar) — */
    .mt-print-title { display: none; }

    /* — Table — */
    .mt-table {
      border-collapse: separate; border-spacing: 0;
      font-size: 11px; min-width: 100%;
    }

    /* Header row */
    .mt-table thead th {
      background: var(--text); color: #fff;
      font-size: 10px; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
      padding: 7px 4px;
      position: sticky; top: 0; z-index: 3;
      border-bottom: 2px solid #374151;
      white-space: nowrap;
    }

    /* Data cells */
    .mt-table td {
      padding: 5px 4px; text-align: center;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    /* Sticky col 1: HARI — width tetap perlu deterministik karena col-2 sticky bergantung padanya */
    .mt-s1 {
      width: 38px; min-width: 38px;
      position: sticky; left: 0; z-index: 2;
    }
    /* Sticky col 2: TGL */
    .mt-s2 {
      width: 76px; min-width: 76px;
      position: sticky; left: 38px; z-index: 2;
    }
    /* Corner: both sticky top AND left */
    thead .mt-s1 { z-index: 6; }
    thead .mt-s2 { z-index: 6; }

    /* Normal rows */
    .mt-table tbody tr td { background: #fff; }
    .mt-table tbody tr td.mt-s1,
    .mt-table tbody tr td.mt-s2 { background: #fff; }

    /* Weekend */
    .mt-table tbody tr.mt-weekend td { background: #F1F5F9; color: var(--muted); }
    .mt-table tbody tr.mt-weekend td.mt-s1,
    .mt-table tbody tr.mt-weekend td.mt-s2 { background: #F1F5F9; }

    /* Opening stock row */
    .mt-table tbody tr.mt-opening td {
      background: #F8FAFC; font-weight: 700;
      font-size: 10px; color: var(--muted);
      border-bottom: 2px solid var(--border);
    }
    .mt-table tbody tr.mt-opening td.mt-s1,
    .mt-table tbody tr.mt-opening td.mt-s2 { background: #F8FAFC; }

    /* Total row */
    .mt-table tfoot td {
      background: var(--text); color: #fff;
      font-weight: 800; font-size: 11px;
      padding: 7px 4px;
      border-top: 2px solid #374151;
      position: sticky; bottom: 0; z-index: 2;
    }
    .mt-table tfoot td.mt-s1,
    .mt-table tfoot td.mt-s2 { z-index: 4; }

    /* Value colors */
    .mt-user-val  { font-weight: 700; color: var(--red); }
    .mt-masuk-val { font-weight: 800; color: var(--green); }
    .mt-keluar-val{ font-weight: 800; color: var(--red); }
    .mt-koreksi-val.plus  { font-weight: 800; color: var(--purple); }
    .mt-koreksi-val.minus { font-weight: 800; color: var(--amber); }
    .mt-sisa-val  { font-weight: 800; color: var(--text); }
    .mt-zero      { color: #CBD5E1; }

    /* Tfoot value colors (on dark bg) */
    tfoot .mt-masuk-val  { color: #6EE7B7; }
    tfoot .mt-keluar-val { color: #FCA5A5; }
    tfoot .mt-koreksi-val.plus  { color: #D8B4FE; }
    tfoot .mt-koreksi-val.minus { color: #FCD34D; }
    tfoot .mt-sisa-val   { color: #fff; }

    /* Column widths */
    .mt-col-user   { min-width: 38px; }
    .mt-col-pm     { min-width: 38px; }
    .mt-col-koreksi{ min-width: 40px; }
    .mt-col-sisa   { min-width: 40px; }

    /* — Catatan Koreksi Stok (di bawah tabel) — */
    .mt-koreksi-notes {
      border-top: 1px solid var(--line); padding: 12px 14px 16px;
      flex-shrink: 0; background: #FAF5FF;
    }
    .mt-koreksi-notes-title {
      font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--purple); margin-bottom: 8px;
      display: flex; align-items: center; gap: 5px;
    }
    .mt-koreksi-note-item {
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px 10px; border-radius: var(--r-md);
      background: #fff; border: 1px solid #F3E8FF;
      margin-bottom: 6px;
    }
    .mt-koreksi-note-item:last-child { margin-bottom: 0; }
    .mt-koreksi-note-row1 {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .mt-koreksi-note-meta { font-size: 11px; font-weight: 700; color: var(--muted); }
    .mt-koreksi-note-delta { font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .mt-koreksi-note-delta.plus  { color: var(--purple); }
    .mt-koreksi-note-delta.minus { color: var(--amber); }
    .mt-koreksi-note-text {
      font-size: 12px; color: var(--text); line-height: 1.4;
    }

    /* — Picker (dropdown Bulan & Tahun): tampil sebagai kartu di tengah layar — */
    .monthly-backdrop.mt-picking { justify-content: center; padding: 16px; }
    .monthly-backdrop.mt-picking .monthly-sheet {
      height: auto; max-height: 90vh; max-height: 90dvh;
      max-width: min(94vw, 520px); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
    }
    .mt-picker-card { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 18px; }
    .mt-picker-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mt-picker-heading { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .mt-picker-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .mt-field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .mt-field > label { font-size: 15px; font-weight: 500; color: var(--muted); }
    .mt-select {
      width: 100%; min-height: 58px; padding: 0 42px 0 20px;
      font-family: inherit; font-size: 18px; font-weight: 400; color: var(--text);
      background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%231E293B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 16px center / 18px;
      border: 2px solid #E2E8F0; border-radius: 20px; outline: none;
      -webkit-appearance: none; appearance: none; cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .mt-select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
    .btn-render {
      width: 100%; padding: 17px 20px;
      background: var(--brand); border: none; border-radius: 22px;
      font-size: 18px; font-weight: 700; color: #fff;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px rgba(29,78,216,.28);
      transition: transform .12s, filter .15s;
    }
    .btn-render:active { transform: scale(.98); filter: brightness(.95); }

    /* ════════════════════════════════════════
       12. TOAST (center, besar, transparan)
    ════════════════════════════════════════ */
    .toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(.92);
      background: rgba(30,41,59,.82);
      color: #fff; padding: 16px 28px;
      border-radius: var(--r-lg); font-size: 21px; font-weight: 800;
      max-width: calc(100vw - 64px); text-align: center; z-index: 999;
      opacity: 0; transition: opacity .22s ease, transform .22s ease;
      pointer-events: none; white-space: normal; line-height: 1.4;
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow: 0 14px 44px rgba(0,0,0,.28);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast.ok   { background: rgba(21,128,61,.85);  }
    .toast.err  { background: rgba(185,28,28,.85);  }

    /* ════════════════════════════════════════
       13. PRINT (export PDF via window.print)
    ════════════════════════════════════════ */
    @media print {
      body.mt-printing * { visibility: hidden; }
      body.mt-printing .monthly-sheet,
      body.mt-printing .monthly-sheet * { visibility: visible; }

      body.mt-printing .monthly-backdrop {
        position: absolute; inset: 0; background: none;
        height: auto; align-items: flex-start; display: block;
      }
      body.mt-printing .monthly-sheet {
        height: auto; max-width: 100%; width: 100%;
        border-radius: 0; box-shadow: none; animation: none;
      }
      body.mt-printing .mt-header,
      body.mt-printing .mt-loading { display: none !important; }

      body.mt-printing .mt-print-title {
        display: block !important;
        font-size: 16px; font-weight: 800;
        padding: 0 4px 8px; text-align: center;
      }
      body.mt-printing .mt-wrap { overflow: visible; height: auto; }
      body.mt-printing .mt-koreksi-notes { break-inside: avoid; }
      body.mt-printing .mt-table thead th,
      body.mt-printing .mt-table tfoot td,
      body.mt-printing .mt-table td.mt-s1,
      body.mt-printing .mt-table td.mt-s2 { position: static; }
    }

    /* ════════════════════════════════════════
       14. BUTTON SPINNER (Login, Kirim, Hapus)
    ════════════════════════════════════════ */
    .btn-spin { animation: spin .7s linear infinite; flex-shrink: 0; vertical-align: -3px; }

    /* ════════════════════════════════════════
       15. CONFIRM MODAL (Logout, Tabel Bulanan)
    ════════════════════════════════════════ */
    .confirm-msg { font-size: 14px; color: var(--muted); line-height: 1.55; }

    /* ════════════════════════════════════════
       16. WAKTU TRANSAKSI & LABEL SUSULAN
    ════════════════════════════════════════ */
    .time-row { background: var(--bg); border-radius: var(--r-md); padding: 4px 12px; }
    .time-now, .time-edit-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .time-label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .time-label strong { color: var(--text); font-weight: 800; }
    .time-hint { font-weight: 500; font-size: 11px; }
    .time-link {
      appearance: none; border: none; background: transparent; color: var(--brand);
      font-size: 13px; font-weight: 800; padding: 9px 0 9px 10px; white-space: nowrap;
      cursor: pointer; touch-action: manipulation;
    }
    .time-inputs { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; padding-bottom: 8px; }
    .time-inputs .t-input { padding: 10px 12px; font-size: 14px; min-width: 0; }
    .tx-pills { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .tx-pill.susulan { background: #FEF3C7; color: #92400E; }

    /* ════════════════════════════════════════
       17. PENGUMUMAN
    ════════════════════════════════════════ */
    .ann-list { margin: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
    .ann-item {
      display: flex; align-items: flex-start; gap: 10px;
      border-radius: var(--r-lg); padding: 12px 12px 12px 14px;
      border-left: 5px solid; box-shadow: var(--shadow);
    }
    .ann-item.info { border-color: var(--brand); background: var(--brand-lt); }
    .ann-item.warn { border-color: var(--amber); background: #FFFBEB; }
    .ann-body  { flex: 1; min-width: 0; }
    .ann-title { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .ann-text  { font-size: 14px; font-weight: 600; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .ann-ok {
      appearance: none; border: none; background: rgba(0,0,0,.07); color: var(--text);
      border-radius: var(--r-pill); font-size: 12px; font-weight: 800; padding: 8px 12px;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    .ann-ok:active { transform: scale(.95); }
    .ann-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ann-chip {
      appearance: none; border: 1.5px solid var(--border); background: #fff; color: var(--text);
      border-radius: var(--r-pill); font-size: 13px; font-weight: 700; padding: 7px 12px;
      cursor: pointer; touch-action: manipulation;
    }
    .ann-chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .ann-textarea { resize: vertical; min-height: 78px; font-family: inherit; line-height: 1.4; }
    select.t-input { appearance: auto; -webkit-appearance: menulist; background: #fff; }
    .ann-admin-list { display: flex; flex-direction: column; gap: 6px; }
    .ann-admin-item { background: #fff; border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .ann-admin-meta { font-size: 11px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .ann-admin-text { font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .ann-admin-off {
      align-self: flex-end; appearance: none; border: none; background: transparent;
      color: var(--red); font-size: 12px; font-weight: 800; padding: 6px 0 0 10px; cursor: pointer;
    }
    .ann-admin-read { font-size: 12px; font-weight: 700; color: var(--amber); line-height: 1.4; }
    .ann-admin-read.done { color: var(--green); }

    /* ════════════════════════════════════════
       18. BADGE EDIT & MODAL RIWAYAT LENGKAP
    ════════════════════════════════════════ */
    .tx-pill.edit { background: #E0E7FF; color: #3730A3; }
    .history-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.6);
      z-index: 85; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      animation: fadeIn .2s ease;
    }
    .history-sheet {
      width: 100%; max-width: min(96vw, 720px);
      height: 94vh; height: 94dvh; background: var(--card);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      display: flex; flex-direction: column; overflow: hidden; min-height: 0;
      animation: slideUp .22s ease;
    }
    .history-sub { padding: 8px 14px; font-size: 11px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .hist-mine-btn {
      appearance: none; border: 1.5px solid var(--brand); background: var(--brand-lt); color: var(--brand-dk);
      border-radius: var(--r-pill); font-size: 11px; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; padding: 6px 12px; cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    .hist-mine-btn:active { transform: scale(.95); background: #DBEAFE; }
    .tx-nama.tx-when-date { font-size: 14px; }
    .tx-time.tx-when-time { font-size: 15px; font-weight: 800; color: var(--text); }
    /* ════════════════════════════════════════
       19. KENYAMANAN: SINKRON, JUMLAH CEPAT, MENU ⋯, SOROT
    ════════════════════════════════════════ */
    .sc-sync {
      appearance: none; border: none; background: transparent; color: inherit; font-family: inherit;
      display: flex; align-items: center; gap: 7px; padding: 6px 0; margin-bottom: 8px;
      cursor: pointer; touch-action: manipulation; position: relative; z-index: 1;
      max-width: 100%; text-align: left;
    }
    .sc-sync:active { opacity: .7; }
    .sc-sync .sc-online-label { text-transform: none; letter-spacing: .02em; font-size: 12px; font-weight: 700; }
